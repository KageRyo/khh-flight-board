name: Check published data
on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_run:
    workflows: ['Publish flight board']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: published-data-check
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:freshness
