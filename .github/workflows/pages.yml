name: Publish flight board
run-name: ${{ inputs.recovery && 'Recover published flight data' || 'Publish flight board' }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery:
        description: Triggered by published-data recovery
        type: boolean
        default: false
  schedule:
    - cron: '3-59/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run check
      - run: npm test
      - name: Fetch four official feeds and build static snapshot
        run: npm run build:pages
        env:
          PREVIOUS_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify recovered snapshots
        if: inputs.recovery
        run: |
          for attempt in 1 2 3; do
            if npm run check:freshness; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
