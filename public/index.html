<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181624">
  <meta name="description" content="依高雄小港機場現場看板照片重製的國際入出境、國內到離站航班資訊。">
  <title>KHH Flight Board · 高雄機場航班看板</title>
  <link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="shell">
    <nav class="controls" aria-label="看板設定">
      <a class="app-name" href="./">KHH <span>FLIGHT BOARD</span></a>
      <div class="tabs" role="group" aria-label="選擇航班看板">
        <button data-source="int" class="selected" aria-pressed="true">國際出境</button><button data-source="int-arr" aria-pressed="false">國際入境</button><button data-source="dom" aria-pressed="false">國內離站</button><button data-source="dom-arr" aria-pressed="false">國內到站</button>
      </div>
      <div class="tools"><input id="search" type="search" aria-label="搜尋航班、地點、航空公司" placeholder="搜尋航班 / 地點"><select id="filter" aria-label="篩選航班"><option value="all">全部航班</option><option value="active">未完成航班</option></select><button id="refresh" aria-label="更新航班">↻</button><button id="fullscreen" aria-label="進入全螢幕">⛶</button></div>
    </nav>
    <main class="fids" id="fids" aria-label="機場航班看板">
      <header class="board-title"><time id="clock">--:--</time><h1><span id="title-zh">國際線出境</span> <span id="title-en">DEPARTURES</span></h1><div class="airport-brand"><span class="brand-strokes" aria-hidden="true">///</span><strong>KHH</strong></div></header>
      <div id="notice" class="notice" role="status" hidden></div>
      <section id="board" class="board" aria-label="航班資訊" aria-busy="true"></section>
      <div id="empty" class="empty" hidden><h2 id="empty-title">正在取得航班</h2><p id="empty-copy">請稍候</p></div>
      <div class="announcement"><p>高雄國際航空站歡迎您　Welcome to Kaohsiung International Airport</p><span id="page">01 / 01</span></div>
    </main>
    <div class="statusbar"><p><span id="live-dot" class="live-dot"></span><strong id="connection">連線中</strong><span id="summary"></span><span id="date"></span></p><div><button id="previous" aria-label="上一頁">‹</button><button id="rotate" aria-pressed="true">Ⅱ 暫停輪播</button><button id="next" aria-label="下一頁">›</button></div></div>
    <footer><p>最後成功取得 <time id="last-success">尚未成功</time><span id="age"></span><span id="poll-label"></span></p><details><summary>資料與看板說明</summary><p>依使用者提供的現場照片重現雙欄／單欄、色帶與航班列布局。部分字型及航空公司識別為網頁適配，非精確逐像素複製。官方公開 JSON 未提供航班日期與發布時間；最後成功取得時間不代表來源最後更新時間。非內部 FIDS 同步，行程以機場及航空公司公告為準。<a id="source-link" target="_blank" rel="noreferrer">官方資料 ↗</a></p></details></footer>
  </div>
  <noscript>請啟用 JavaScript 以取得航班資訊。</noscript>
</body>
</html>
